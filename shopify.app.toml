client_id = "edd144f6608c823d69ea88572a3ba130"
application_url = "https://cultural-tale-warrant-contains.trycloudflare.com"
embedded = true
name = "customer-support-app"
handle = "customer-support-app"

[build]
include_config_on_deploy = true
dev_store_url = "sacc-demo.myshopify.com"
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = [
  "https://cultural-tale-warrant-contains.trycloudflare.com/auth/callback",
  "https://cultural-tale-warrant-contains.trycloudflare.com/auth/shopify/callback",
  "https://cultural-tale-warrant-contains.trycloudflare.com/api/auth/callback"
]

[pos]
embedded = false
